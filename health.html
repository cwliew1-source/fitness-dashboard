   <div class="hsub" style="text-align:left">Deep ${f(r.deep_min,0)}m · REM ${f(r.rem_min,0)}m · Core ${f(r.core_min,0)}m · Awake ${f(r.awake_min,0)}m</div></div>${gauge(r.sleep_debt_h!=null?+r.sleep_debt_h:null,20)}</div>

  <div><div class="big mono">${f(st7)}<small>7d avg</small></div><div class="hsub" style="text-align:left">30-day avg ${f(stA30)} · ${st30.filter(q=>q.v>=STEP_GOAL).length}/30 days at goal</div></div></div>
  ${bars(st30,{col:'#2ee6a6',col2:'#2ee6a6',goal:STEP_GOAL})}</div>
 <div class="card" style="animation-delay:240ms"><h3><span>Strain · 30 days</span><em>0–21 scale</em></h3>

  ${[['VO₂ max',vo?f(vo.v,1):'–','ml/kg/min',vo?'as of '+vo.d:'',series('vo2max',SEL,365),'#36d6ff'],

 <div class="card span3" style="animation-delay:400ms"><h3><span>Trends</span><em>vs previous period</em></h3>
  <table><tr><th>Metric</th><th>7d</th><th>Δ</th><th>30d</th><th>Δ</th></tr>
  ${trow('Recovery %','recovery',0,true)}${trow('HRV ms','hrv',0,true)}${trow('Resting HR','rhr',1,false)}${trow('Sleep h','sleep_min',2,true,1/60)}${trow('Steps','steps',0,true)}${trow('Strain','strain',1,true)}${trow('Active kcal','active_kcal',0,true)}${trow('Exercise min','exercise_min',0,true)}</table></div>
 <div class="card span3" style="animation-delay:450ms"><details><summary>How these scores are worked out</summary><p style="margin-top:8px">
  <b>Recovery (0–100)</b> = 50% HRV + 25% resting HR + 25% sleep. HRV part <code>50 + 20 × (today − 60-day mean) ÷ 60-day SD</code>; resting HR part <code>50 + 20 × (60-day mean − today) ÷ SD</code> (lower is better); sleep part <code>100 × sleep ÷ 7.5h</code>. Each part is clamped 0–100. Baselines use the 60 days before the selected day and need at least 10 readings. ≥67 green, 34–66 yellow, &lt;34 red.<br>
  <b>Sleep debt</b> = sum of (7.5h − sleep) over the last 14 nights with data, floored at 0. A night belongs to the date you woke up. Apple Watch sleep is used when present, otherwise the source with the most sleep that night (WHOOP, Eight Sleep, iPhone).<br>
  <b>Strain (0–21)</b> = <code>21 × (1 − e^(−load/1500))</code>, where load = active kcal + 5 × exercise minutes.<br>
  <b>Steps / energy / exercise</b>: iPhone and Watch overlap, so each hour takes the highest single-source value, then hours are summed.</p></details></div>`;
 requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.arc').forEach(a=>a.style.strokeDashoffset=a.dataset.off)));
 // strip
 const end=days[days.length-1];let last=addD(SEL,7);if(last>end)last=end;let h='';for(let i=20;i>=0;i--){const d=addD(last,-i);const x=IDX[d],dt=new Date(d+'T12:00:00Z');h+=`<div class="dy ${d==SEL?'on':''}" data-d="${d}">${dt.toLocaleDateString('en-AU',{weekday:'short',timeZone:'UTC'})}<b>${dt.getUTCDate()}</b><i style="background:${x?band(x.recovery):'#222'}"></i></div>`}
 $('#strip').innerHTML=h;const on=$('#strip .on');if(on)on.scrollIntoView({inline:'center',block:'nearest'});
 $('#dpick').value=SEL;$('#next').disabled=SEL>=end;$('#prev').disabled=SEL<=days[0];
 document.querySelectorAll('[data-count]').forEach(el=>{const t=+el.dataset.count;if(!el.dataset.count)return;const sm=el.querySelector('small').outerHTML;let s=null;const step=ts=>{s=s||ts;const p=Math.min(1,(ts-s)/1100),e=1-Math.pow(1-p,3);el.innerHTML=Math.round(t*e)+sm;if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}
function go(d){const days=D.map(x=>x.date);if(d<days[0])d=days[0];if(d>days[days.length-1])d=days[days.length-1];SEL=d;render()}
function boot(rows){D=rows.sort((a,b)=>a.date<b.date?-1:1);IDX={};D.forEach(r=>IDX[r.date]=r);const last=D[D.length-1].date;
 $('#asof').textContent='Snapshot from Apple Health export · data as of '+fmtD(last)+' · '+D[0].date.slice(0,4)+'–'+last.slice(0,4);
 $('#dpick').min=D[0].date;$('#dpick').max=last;$('#app').style.display='';SEL=last;render();
 if(window.__wired)return;window.__wired=1;
 $('#prev').onclick=()=>go(addD(SEL,-1));$('#next').onclick=()=>go(addD(SEL,1));$('#dpick').onchange=e=>e.target.value&&go(e.target.value);
 $('#strip').onclick=e=>{const t=e.target.closest('.dy');if(t)go(t.dataset.d)};
 document.addEventListener('keydown',e=>{if(e.key=='ArrowLeft')go(addD(SEL,-1));if(e.key=='ArrowRight')go(addD(SEL,1))});
 let tx=null;document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});document.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>80&&!e.target.closest('.strip'))go(addD(SEL,dx>0?-1:1));tx=null},{passive:true})}
async function init(){const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:'cw-fitness-auth'}});
 const {data:{session}}=await sb.auth.getSession();if(!session){$('#gate').style.display='block';return}
 const CK='cw-health-cache';try{const c=JSON.parse(localStorage.getItem(CK));if(c&&c.length)boot(c)}catch(e){}
 let all=[];for(let from=0;;from+=1000){const {data,error}=await sb.from('health_daily').select('*').order('date').range(from,from+999);if(error){$('#asof').textContent='Could not load: '+error.message;$('#app').style.display='';return}all=all.concat(data);if(data.length<1000)break}
 if(!all.length){$('#asof').textContent='No health data yet';$('#app').style.display='';return}
 const slim=all.map(r=>{const o={};for(const k in r)if(r[k]!=null&&k!='user_id'&&k!='updated_at')o[k]=typeof r[k]=='string'&&k!='date'&&k!='sleep_src'?+r[k]:r[k];return o});
 try{localStorage.setItem(CK,JSON.stringify(slim))}catch(e){}const keep=SEL;boot(slim);if(keep)go(keep)}
init();
